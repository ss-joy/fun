<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>HeartOS 98</title>
<!--
  HeartOS 98 — a fake retro operating system that boots up just for her.

  Personalise it with URL parameters:
    index.html?her=Priya&him=Sam
  or edit CONFIG near the top of the <script> below.
-->
<style>
  :root {
    --desk: #008080;
    --face: #c0c0c0;
    --light: #dfdfdf;
    --white: #ffffff;
    --grey: #808080;
    --black: #0a0a0a;
    --title-a: #000080;
    --title-b: #1084d0;
    --love: #e0306f;
    --tb: calc(40px + env(safe-area-inset-bottom, 0px)); /* taskbar height */
    --ui: Tahoma, "MS Sans Serif", "Segoe UI", Geneva, Verdana, sans-serif;
    --mono: "Lucida Console", "Courier New", Courier, monospace;

    --raised: inset -1px -1px var(--black), inset 1px 1px var(--white),
              inset -2px -2px var(--grey), inset 2px 2px var(--light);
    --window: inset -1px -1px var(--black), inset 1px 1px var(--light),
              inset -2px -2px var(--grey), inset 2px 2px var(--white);
    --sunken: inset -1px -1px var(--white), inset 1px 1px var(--grey),
              inset -2px -2px var(--light), inset 2px 2px var(--black);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--desk);
    color: #000;
    font: 14px/1.45 var(--ui);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; /* no double-tap zoom while chasing buttons */
    overscroll-behavior: none;
    transition: background-color 1.2s ease;
  }
  body.love { --desk: #c43c74; --title-a: #7a0f3f; --title-b: #ff6fa5; }
  body.busy, body.busy * { cursor: progress !important; }
  p { margin: 0 0 8px; }
  p:last-child { margin-bottom: 0; }

  /* ---------- Boot screen ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 100;
    background: #000; color: #bdbdbd;
    font: 13px/1.6 var(--mono);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px;
    white-space: pre-wrap;
    overflow: hidden;
    cursor: pointer;
  }
  #boot .logo { color: #fff; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Desktop ---------- */
  #desktop { position: fixed; inset: 0 0 var(--tb) 0; z-index: 2; }
  .icons {
    position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 4px; right: 4px;
    display: flex; flex-wrap: wrap; gap: 2px;
  }
  .icon {
    width: 78px; padding: 4px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 0; color: #fff; font: inherit; text-align: center;
    cursor: pointer;
  }
  .icon .glyph { font-size: 32px; line-height: 1; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.35)); }
  .icon .name { padding: 0 3px; font-size: 13px; }
  .icon:focus { outline: none; }
  .icon:focus .name, .icon:active .name { background: var(--title-a); outline: 1px dotted #fff; }

  /* ---------- Taskbar ---------- */
  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 5000;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 4px calc(3px + env(safe-area-inset-bottom, 0px));
    background: var(--face);
    box-shadow: inset 0 1px var(--light), inset 0 2px var(--white);
  }
  .start {
    display: flex; align-items: center; gap: 5px;
    height: 32px; min-height: 0; padding: 0 10px 0 6px;
    font-weight: bold;
  }
  .start svg { width: 18px; height: 16px; }
  .task {
    height: 32px; max-width: 200px; min-width: 0; padding: 0 8px;
    display: none; align-items: center; gap: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: var(--sunken);
    background: repeating-conic-gradient(var(--face) 0 25%, var(--white) 0 50%) 0 0 / 2px 2px;
    font-weight: bold;
  }
  .task.on { display: flex; }
  .tray {
    margin-left: auto; height: 32px; padding: 0 8px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: inset -1px -1px var(--white), inset 1px 1px var(--grey);
  }
  .tray button { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; line-height: 1; }
  .tray button:focus-visible { outline: 1px dotted #000; }

  #startmenu {
    position: fixed; left: 2px; bottom: calc(var(--tb) - 2px); z-index: 6000;
    display: none; width: 210px; padding: 3px 3px 3px 30px;
    background: var(--face); box-shadow: var(--window);
  }
  #startmenu.open { display: block; }
  #startmenu::before {
    content: "HeartOS 98";
    position: absolute; left: 3px; top: 3px; bottom: 3px; width: 24px;
    background: linear-gradient(0deg, var(--title-a), var(--title-b));
    color: var(--light); font-weight: bold; font-size: 15px;
    writing-mode: vertical-rl; transform: rotate(180deg);
    display: flex; align-items: center; justify-content: flex-start; padding: 8px 0;
  }
  #startmenu button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 8px; background: none; border: 0; font: inherit; text-align: left; cursor: pointer;
  }
  #startmenu button:hover, #startmenu button:focus-visible { background: var(--title-a); color: #fff; outline: none; }
  #startmenu hr { border: 0; border-top: 1px solid var(--grey); border-bottom: 1px solid var(--white); margin: 2px 0; }

  /* ---------- Buttons ---------- */
  .b {
    min-width: 80px; min-height: 36px; padding: 6px 14px;
    background: var(--face); color: #000;
    border: 0; border-radius: 0; box-shadow: var(--raised);
    font: inherit; cursor: pointer;
  }
  .b:active:not(:disabled) { box-shadow: var(--sunken); padding: 7px 13px 5px 15px; }
  .b:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .b:disabled { color: var(--grey); text-shadow: 1px 1px var(--white); cursor: default; }
  .b.default { box-shadow: inset 0 0 0 1px var(--black), var(--raised); }

  /* ---------- Windows ---------- */
  .win {
    position: fixed;
    max-width: calc(100vw - 12px);
    padding: 3px;
    background: var(--face);
    box-shadow: var(--window);
  }
  .titlebar {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 3px 3px 5px;
    background: linear-gradient(90deg, var(--title-a), var(--title-b));
    color: #fff; font-weight: bold;
    cursor: move; touch-action: none;
  }
  .win.inactive .titlebar { background: linear-gradient(90deg, var(--grey), #b5b5b5); color: var(--light); }
  .titlebar .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbtn {
    width: 24px; height: 22px; padding: 0; flex: none;
    background: var(--face); border: 0; box-shadow: var(--raised);
    color: #000; font: bold 14px/1 var(--ui); cursor: pointer;
  }
  .tbtn:active { box-shadow: var(--sunken); }
  .tbtn + .tbtn { margin-left: -2px; }
  .tbtn.x { margin-left: 2px; }
  .wbody { padding: 14px 12px 12px; }
  .row { display: flex; gap: 14px; align-items: flex-start; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .actions.center { justify-content: center; }

  /* the runaway "No" */
  .runaway { position: fixed !important; z-index: 9999; transition: left .18s ease-out, top .18s ease-out; }
  .yes-grow { transition: transform .2s ease-out; transform-origin: center; }

  /* ---------- Dialog icons ---------- */
  .ico {
    flex: none; width: 34px; height: 34px;
    display: grid; place-items: center;
    font: bold 22px/1 Georgia, "Times New Roman", serif; color: #fff;
    border-radius: 50%;
  }
  .ico.err { background: #e01010; box-shadow: inset -2px -2px #900; font-family: var(--ui); }
  .ico.info { background: #fff; color: #00a; box-shadow: inset -2px -2px #9aa, 0 0 0 1px #000; }
  .ico.q { background: #fff; color: #00a; box-shadow: inset -2px -2px #9aa, 0 0 0 1px #000; }
  .ico.warn {
    border-radius: 0; background: #ffd400; color: #000; padding-top: 10px; font-size: 18px;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .ico.heart { border-radius: 0; background: none; }
  .ico.heart svg { width: 34px; height: 30px; }

  /* ---------- Installer ---------- */
  .progress {
    height: 22px; padding: 3px; margin: 10px 0 8px;
    background: var(--white); box-shadow: var(--sunken);
  }
  .progress .fill {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg, var(--title-a) 0 9px, transparent 9px 11px);
    transition: width .7s steps(8);
  }
  .muted { color: #333; min-height: 2.9em; }

  /* ---------- Choices, contact card ---------- */
  .choices { display: grid; gap: 6px; margin-top: 14px; }
  .choices .b { text-align: left; padding-left: 12px; }
  .radio { display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; }
  .radio input { accent-color: var(--title-a); margin: 0; width: 18px; height: 18px; }
  .radio.struck { color: var(--grey); text-decoration: line-through; cursor: default; }
  .sep { border: 0; border-top: 1px solid var(--grey); border-bottom: 1px solid var(--white); margin: 14px -12px 0; }
  .contact {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; margin-bottom: 12px;
    background: var(--white); box-shadow: var(--sunken);
  }
  .avatar { font-size: 30px; line-height: 1; }
  .muted-sm { color: var(--grey); font-size: 12px; }
  .b.danger { color: #b00000; font-weight: bold; }

  /* ---------- Notepad ---------- */
  .menubar { display: flex; gap: 2px; padding: 2px 0 3px; }
  .menubar span { padding: 1px 7px; }
  .menubar span::first-letter { text-decoration: underline; }
  .paper {
    height: min(360px, calc(100vh - 200px)); height: min(360px, calc(100dvh - 200px));
    overflow: auto; padding: 8px 10px;
    background: var(--white); box-shadow: var(--sunken);
    font: 14px/1.6 var(--mono); white-space: pre-wrap;
    user-select: text; -webkit-user-select: text;
  }
  .caret { display: inline-block; width: 8px; height: 1.1em; vertical-align: text-bottom; background: #000; animation: blink 1s steps(1) infinite; }
  .notepad .wbody { padding: 2px 3px 3px; }

  /* ---------- Hearts ---------- */
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .fall { position: absolute; top: -40px; animation: fall linear forwards; }
  .fall svg { display: block; width: 100%; height: auto; }
  @keyframes fall {
    to { transform: translateY(calc(100vh + 80px)) rotate(var(--spin, 0deg)); }
  }

  @media (max-width: 520px) {
    .task { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .runaway { transition: none; }
    .blink, .caret { animation: none; }
    .progress .fill { transition: none; }
  }
</style>
</head>
<body>

<div id="boot" role="log" aria-live="polite"></div>

<main id="desktop" hidden>
  <div class="icons">
    <button class="icon" data-app="bf"><span class="glyph" aria-hidden="true">🤵</span><span class="name">Boyfriend.exe</span></button>
    <button class="icon" data-app="blocked"><span class="glyph" aria-hidden="true">📵</span><span class="name">Blocked contacts</span></button>
    <button class="icon" data-app="bin"><span class="glyph" aria-hidden="true">🗑️</span><span class="name">Recycle Bin</span></button>
    <button class="icon" data-app="letter"><span class="glyph" aria-hidden="true">💌</span><span class="name">sorry.txt</span></button>
  </div>
</main>

<nav id="startmenu" aria-label="Start menu">
  <button data-menu="restart"><span aria-hidden="true">🔁</span> Restart HeartOS</button>
  <hr>
  <button data-menu="shutdown"><span aria-hidden="true">⏻</span> Shut down...</button>
</nav>

<footer id="taskbar" hidden>
  <button class="b start" id="startbtn" aria-haspopup="true" aria-expanded="false">
    <svg viewBox="0 0 18 16" aria-hidden="true" shape-rendering="crispEdges">
      <rect x="1" y="1" width="7" height="6" fill="#e0306f"/><rect x="9" y="1" width="7" height="6" fill="#33a852"/>
      <rect x="1" y="8" width="7" height="6" fill="#2e6fe0"/><rect x="9" y="8" width="7" height="6" fill="#f5c400"/>
    </svg>
    Start
  </button>
  <div class="task" id="task"></div>
  <div class="tray">
    <button id="mute" aria-label="Mute sounds" title="Sound">🔊</button>
    <span id="clock"></span>
  </div>
</footer>

<div id="hearts" aria-hidden="true"></div>

<script>
/* ======================== CONFIG ======================== */
const params = new URLSearchParams(location.search);
const CONFIG = {
  her: params.get('her') || 'Rupa',              // her name
  him: params.get('him') || 'Joy',               // his name, used in sentences
  contact: params.get('him') || 'Joy',           // his name in her phone's contacts
  signature: params.get('him') || 'Joy',         // how the letter is signed
  fightTime: '23:00',                            // roughly when she said "I'll block you" last night
  letter:
`Hi {HER},

So. You didn't block me.

I know last night got out of hand, and I'm sorry. You didn't deserve that.

I'm really glad you're still here, even if it's only because you "forgot" to press one button.

Let me make it up to you. Food is on me, you pick the place, and I promise not to say "anywhere is fine".

I love you.

- {HIM}`
};
/* ======================================================== */

const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HER = esc(CONFIG.her);
const HIM = esc(CONFIG.him);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const desktop = $('#desktop');

const HEART_SVG = (fill = '#e0306f') =>
  `<svg viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="1" y="0" width="2" height="1" fill="${fill}"/><rect x="4" y="0" width="2" height="1" fill="${fill}"/>
    <rect x="0" y="1" width="7" height="2" fill="${fill}"/><rect x="1" y="3" width="5" height="1" fill="${fill}"/>
    <rect x="2" y="4" width="3" height="1" fill="${fill}"/><rect x="3" y="5" width="1" height="1" fill="${fill}"/>
    <rect x="1" y="1" width="1" height="1" fill="#fff" opacity=".8"/>
  </svg>`;

const ICON = {
  err: '<div class="ico err" aria-hidden="true">×</div>',
  info: '<div class="ico info" aria-hidden="true">i</div>',
  q: '<div class="ico q" aria-hidden="true">?</div>',
  warn: '<div class="ico warn" aria-hidden="true">!</div>',
  heart: `<div class="ico heart">${HEART_SVG()}</div>`,
};

/* ---------- Sound (tiny Web Audio beeps, no files) ---------- */
let audio, muted = false;
function tone(freqs, dur = 0.12, type = 'square', vol = 0.04) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t0 + i * dur);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur);
      o.connect(g).connect(audio.destination);
      o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.02);
    });
  } catch (e) { /* sound is optional */ }
}
const sfx = {
  error: () => tone([196, 147], 0.13, 'square', 0.035),
  ding: () => tone([880, 1320], 0.09, 'triangle', 0.06),
  startup: () => tone([523, 659, 784, 1047, 784, 1047], 0.16, 'triangle', 0.07),
  love: () => tone([659, 784, 988, 1319], 0.14, 'sine', 0.08),
};
function unlockAudio() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { /* sound is optional */ }
}
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔈' : '🔊'; $('#mute').setAttribute('aria-label', muted ? 'Unmute sounds' : 'Mute sounds'); };

/* ---------- Clock ---------- */
function tick() {
  $('#clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
tick(); setInterval(tick, 15000);

/* ---------- Window manager ---------- */
let z = 10;
function refreshActive() {
  const wins = [...document.querySelectorAll('.win')];
  const top = wins.reduce((a, w) => (!a || +w.style.zIndex > +a.style.zIndex ? w : a), null);
  wins.forEach(w => w.classList.toggle('inactive', w !== top));
  const task = $('#task');
  const main = wins.filter(w => !w.dataset.popup).pop();
  task.classList.toggle('on', !!main);
  if (main) task.textContent = main.dataset.title;
}
function focusWin(w) { w.style.zIndex = ++z; refreshActive(); }

const TB = () => $('#taskbar').offsetHeight || 40;
function place(w, x, y) {
  const maxX = innerWidth - w.offsetWidth - 6;
  const maxY = innerHeight - TB() - w.offsetHeight - 6;
  const left = x ?? (innerWidth - w.offsetWidth) / 2;
  const top = y ?? (innerHeight - TB() - w.offsetHeight) / 2 - 10;
  w.style.left = Math.max(6, Math.min(left, maxX)) + 'px';
  w.style.top = Math.max(6, Math.min(top, maxY)) + 'px';
}

function makeDraggable(w) {
  const bar = $('.titlebar', w);
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    const move = ev => {
      w.style.left = Math.max(-w.offsetWidth + 60, Math.min(ev.clientX - dx, innerWidth - 60)) + 'px';
      w.style.top = Math.max(0, Math.min(ev.clientY - dy, innerHeight - 60)) + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}

/**
 * Open a window. `onClose`: function to run when × is pressed.
 * If omitted, × refuses to close (feelings are permanent).
 */
function openWin({ title, html, width = 360, x, y, onClose, help, popup = false, cls = '' }) {
  const w = document.createElement('section');
  w.className = 'win ' + cls;
  w.dataset.title = title.replace(/<[^>]+>/g, '');
  if (popup) w.dataset.popup = '1';
  w.setAttribute('role', 'dialog');
  w.setAttribute('aria-label', w.dataset.title);
  w.style.width = width + 'px';
  w.innerHTML = `
    <div class="titlebar">
      <span class="t">${title}</span>
      <button class="tbtn" data-help aria-label="Help">?</button>
      <button class="tbtn x" data-close aria-label="Close">×</button>
    </div>
    <div class="wbody">${html}</div>`;
  desktop.appendChild(w);
  place(w, x, y);
  focusWin(w);
  makeDraggable(w);
  w.addEventListener('pointerdown', () => focusWin(w));
  $('[data-close]', w).onclick = onClose || (() => msg({
    icon: 'err', title: 'Cannot close window',
    text: `This window can't be closed.<br>Some things are permanent. Like ${HIM}'s feelings for you.`,
  }));
  $('[data-help]', w).onclick = () => msg({
    icon: 'info', title: 'HeartOS Help',
    text: help || 'Help is not available.<br>Tip: pick the answer he would pick.',
  });
  return w;
}
function closeWin(w) { w.remove(); refreshActive(); }

/** A classic message box. Resolves when dismissed. */
function msg({ icon = 'info', title = 'HeartOS', text, ok = 'OK', x, y, width = 320, sound }) {
  (sound || (icon === 'err' || icon === 'warn' ? sfx.error : sfx.ding))();
  return new Promise(resolve => {
    let w;
    const done = () => { closeWin(w); resolve(); };
    w = openWin({
      title, width, x, y, popup: true, onClose: done,
      html: `<div class="row">${ICON[icon]}<p>${text}</p></div>
             <div class="actions center"><button class="b default" data-ok>${ok}</button></div>`,
    });
    const btn = $('[data-ok]', w);
    btn.onclick = done;
    btn.focus({ preventScroll: true });
  });
}
/** A random position for a popup, trying to stay clear of `avoid` (an element). */
function randomSpot(avoid, w = 320, h = 160) {
  const a = avoid && avoid.getBoundingClientRect();
  const bottom = innerHeight - TB();
  for (let i = 0; i < 40; i++) {
    const spot = {
      x: 10 + Math.random() * Math.max(0, innerWidth - w - 20),
      y: 10 + Math.random() * Math.max(0, bottom - h - 20),
    };
    if (!a || spot.x > a.right || spot.x + w < a.left || spot.y > a.bottom || spot.y + h < a.top) return spot;
  }
  // Small screen with no free spot: use whichever edge has more room,
  // so the popup covers the window's text rather than its buttons.
  const x = (innerWidth - w) / 2;
  return a.top >= bottom - a.bottom ? { x, y: 10 } : { x, y: bottom - h - 10 };
}

/* ---------- Hearts ---------- */
let heartTimer;
function spawnHeart(burst = false) {
  const el = document.createElement('div');
  const size = 12 + Math.random() * 26;
  const colors = ['#e0306f', '#ff6fa5', '#ff9ec4', '#c2185b', '#ffffff'];
  el.className = 'fall';
  el.style.left = Math.random() * 100 + 'vw';
  el.style.width = size + 'px';
  el.style.setProperty('--spin', (Math.random() * 60 - 30) + 'deg');
  el.style.animationDuration = (burst ? 2.5 + Math.random() * 2 : 5 + Math.random() * 5) + 's';
  if (burst) el.style.top = (-40 - Math.random() * 300) + 'px';
  el.innerHTML = HEART_SVG(colors[Math.floor(Math.random() * colors.length)]);
  el.addEventListener('animationend', () => el.remove());
  $('#hearts').appendChild(el);
}
function heartRain() {
  if (reduceMotion || heartTimer) return;
  heartTimer = setInterval(() => spawnHeart(), 280);
}
function heartBurst(n = 60) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) spawnHeart(true);
}

/* ---------- Runaway buttons ---------- */
/**
 * Make a button flee from the pointer.
 * `avoid`: the window it belongs to (error popups stay clear of it).
 * `grow`: another button that gets bigger with every dodge.
 * `maxDodges` + `onTired`: give up after this many dodges.
 */
function makeRunaway(btn, { labels, errors = [], avoid, grow, maxDodges = Infinity, onTired }) {
  let n = 0, scale = 1, last = 0, tired = false;

  function dodge(e) {
    if (e) e.preventDefault();
    n++;
    if (n > maxDodges) {
      tired = true;
      btn.remove();
      onTired && onTired();
      return;
    }
    btn.textContent = labels[Math.min(n, labels.length - 1)];
    if (!btn.classList.contains('runaway')) {
      // Lift it out of the window so popups can never cover it.
      const r = btn.getBoundingClientRect();
      btn.classList.add('runaway');
      btn.style.left = r.left + 'px';
      btn.style.top = r.top + 'px';
      document.body.appendChild(btn);
      btn.getBoundingClientRect(); // commit start position so the jump animates
    }
    const maxX = innerWidth - btn.offsetWidth - 10;
    const maxY = innerHeight - TB() - btn.offsetHeight - 10;
    let x, y, tries = 0;
    do {
      x = 10 + Math.random() * Math.max(0, maxX - 10);
      y = 10 + Math.random() * Math.max(0, maxY - 10);
      tries++;
    } while (e && e.clientX != null && Math.hypot(x - e.clientX, y - e.clientY) < 160 && tries < 30);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
    if (grow) {
      scale = Math.min(scale + 0.14, 2.4);
      grow.style.transform = `scale(${scale})`;
    }
    if (errors.length && n % 3 === 0) {
      const spot = randomSpot(avoid);
      msg({ icon: 'err', title: 'HeartOS Error', text: errors[(n / 3 - 1) % errors.length], x: spot.x, y: spot.y });
    }
  }
  // A tap fires pointerdown and then click; only count it once.
  const once = e => {
    if (tired) return;
    if (Date.now() - last > 400) { last = Date.now(); dodge(e); } else e.preventDefault();
  };
  btn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') once(e); });
  btn.addEventListener('pointerdown', once);
  btn.addEventListener('click', once);
}
const closePopups = () => document.querySelectorAll('.win[data-popup]').forEach(p => p.remove());

/* ---------- Scene 1: boot ---------- */
function anyKey() {
  return new Promise(resolve => {
    const go = () => {
      unlockAudio();
      removeEventListener('keydown', go);
      removeEventListener('pointerdown', go);
      resolve();
    };
    addEventListener('keydown', go);
    addEventListener('pointerdown', go);
  });
}

async function boot() {
  const el = $('#boot');
  const lines = [
    ['logo', 'HeartOS BIOS v14.02 (C) Boyfriend Inc.'],
    ['', ''],
    ['', `Detecting user ..... ${CONFIG.her}`],
    ['', `Contacts ........... "${CONFIG.contact}"`],
    ['', 'Block status ....... NOT BLOCKED (?!)'],
    ['', `Last night ......... "I'll block you"`],
    ['', 'Promise status ..... STILL PENDING'],
    ['', ''],
    ['', 'Starting HeartOS 98...'],
    ['', ''],
  ];
  let skip = false;
  const skipper = () => { skip = true; };
  el.addEventListener('pointerdown', skipper);
  addEventListener('keydown', skipper);

  for (const [cls, line] of lines) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    el.appendChild(span);
    for (const ch of line) {
      span.textContent += ch;
      if (!skip && ch !== ' ') await sleep(14);
    }
    el.appendChild(document.createTextNode('\n'));
    if (!skip) await sleep(line.includes('....') ? 420 : 160);
  }
  el.removeEventListener('pointerdown', skipper);
  removeEventListener('keydown', skipper);

  const touch = matchMedia('(pointer: coarse)').matches;
  el.insertAdjacentHTML('beforeend', `${touch ? 'Tap anywhere' : 'Press any key'} to continue<span class="blink">_</span>`);
  await sleep(150);
  await anyKey();
  el.remove();
}

/* ---------- Scene 2: why haven't you blocked him? ---------- */
function hoursSinceFight() {
  const [h, m] = CONFIG.fightTime.split(':').map(Number);
  const now = new Date(), t = new Date(now);
  t.setHours(h, m || 0, 0, 0);
  if (now - t < 60 * 60 * 1000) t.setDate(t.getDate() - 1); // "last night", not tonight
  return Math.max(1, Math.round((now - t) / 3600000));
}

function askWhy() {
  return new Promise(resolve => {
    const hours = hoursSinceFight();
    const answers = [
      ['I forgot', 'Understandable.<br>HeartOS has set a reminder for you. It will go off every 5 minutes, forever.'],
      ['I was busy', `Too busy to press one button for ${hours} hours?<br>Interesting. Very interesting.`],
      ["I'm still deciding", `You've been deciding for ${hours} hours.<br>That's not deciding. That's missing him.`],
      ["I don't actually want to", 'Noted.<br>This answer has been saved and will be used against you later.'],
    ];
    const w = openWin({
      title: 'Pending task',
      width: 360,
      help: 'All answers are recorded and screenshotted.',
      html: `
        <div class="row">${ICON.warn}
          <div>
            <p>Last night you said you would block ${HIM}.</p>
            <p>That was about ${hours} hour${hours === 1 ? '' : 's'} ago, and he is still not blocked.</p>
            <p><b>Why haven't you blocked him yet?</b></p>
          </div>
        </div>
        <div class="choices">
          ${answers.map(([label], i) => `<button class="b" data-i="${i}">${label}</button>`).join('')}
        </div>`,
    });
    w.querySelectorAll('[data-i]').forEach(b => (b.onclick = async () => {
      closeWin(w);
      await msg({ icon: 'info', title: 'Answer recorded', text: answers[b.dataset.i][1], ok: 'Continue' });
      resolve();
    }));
  });
}

/* ---------- Scene 3: give a timeline ---------- */
function askWhen() {
  return new Promise(resolve => {
    const options = ['In 1 hour', 'In 2 hours', 'In 3 hours', 'Tomorrow, probably', 'Never'];
    const w = openWin({
      title: 'Block scheduler',
      width: 360,
      help: 'A promise is a promise.',
      html: `
        <p>A promise is a promise. Please give him a timeline.</p>
        <p><b>When will you block ${HIM}?</b></p>
        ${options.map((o, i) => `<label class="radio"><input type="radio" name="when" value="${i}"> <span>${o}</span></label>`).join('')}
        <hr class="sep">
        <div class="actions"><button class="b default" data-next disabled>Schedule block</button></div>`,
    });
    const next = $('[data-next]', w);
    let picked;
    w.querySelectorAll('input[name=when]').forEach(r => (r.onchange = async () => {
      picked = options[r.value];
      if (picked === 'Never') {
        next.disabled = true;
        await msg({ icon: 'err', title: 'Invalid timeline', text: '"Never" is not a timeline.<br>You promised. Pick a real time.' });
        r.checked = false;
        r.disabled = true;
        r.parentElement.classList.add('struck');
        return;
      }
      next.disabled = false;
    }));
    next.onclick = async () => {
      closeWin(w);
      await msg({
        icon: 'warn', title: 'Scheduling unavailable',
        text: `"${picked}"? No. He has waited long enough.<br><br>Scheduled blocks are not supported. HeartOS only supports blocking him <b>right now</b>.`,
        ok: 'Fine',
      });
      resolve();
    };
  });
}

/* ---------- Scene 4: you have to block him. Now. ---------- */
function forceBlock() {
  return new Promise(resolve => {
    const w = openWin({
      title: 'You have to block him',
      width: 360,
      help: 'Tip: the Block button is shy. Be patient.',
      html: `
        <div class="contact">
          <div class="avatar" aria-hidden="true">🤵</div>
          <div>
            <b>${esc(CONFIG.contact)}</b>
            <div class="muted-sm">Last seen: waiting to be blocked</div>
          </div>
        </div>
        <p>You said you would. He's not leaving until you do.</p>
        <p><b>Block him. Now.</b></p>
        <div class="actions" data-actions>
          <button class="b" data-cancel>Cancel</button>
          <button class="b danger" data-block>Block</button>
        </div>`,
    });
    const actions = $('[data-actions]', w);
    $('[data-cancel]', w).onclick = () => msg({
      icon: 'err', title: 'Not allowed',
      text: "You can't cancel. You're the one who said you'd block him.",
    });
    makeRunaway($('[data-block]', w), {
      avoid: w,
      maxDodges: 8,
      labels: ['Block', 'Block?', 'Are you sure?', 'Really block him?', 'He said sorry though',
        'Think about his face', 'Last chance', 'Okay okay', 'Wait'],
      errors: [
        "Block failed. Your thumb isn't serious.",
        'You hesitated. HeartOS noticed.',
        'This button only works if you really mean it.',
      ],
      onTired: async () => {
        closePopups();
        await msg({ icon: 'info', title: 'HeartOS', text: 'The Block button is tired of running.<br>Fine. Go ahead.', ok: 'Finally' });
        const b = document.createElement('button');
        b.className = 'b danger';
        b.textContent = 'Block';
        actions.appendChild(b);
        b.focus({ preventScroll: true });
        b.onclick = () => { closeWin(w); resolve(); };
      },
    });
  });
}

async function blocking() {
  const w = openWin({
    title: 'Blocking contact',
    width: 360,
    html: `
      <p data-status><b>Blocking ${esc(CONFIG.contact)}...</b></p>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div>
      <p class="muted" data-sub>Starting...</p>`,
  });
  const fill = $('.fill', w), bar = $('.progress', w), sub = $('[data-sub]', w);
  const steps = [
    [14, 'Deleting 1,204 "good morning" texts...'],
    [31, 'Removing memes he sent at 2 AM...'],
    [48, 'Forgetting his laugh...'],
    [63, 'Forgetting his laugh... (failed, retrying)'],
    [79, 'Removing him from your heart...'],
    [99, 'Removing him from your heart... (access denied)'],
  ];
  document.body.classList.add('busy');
  for (const [pct, text] of steps) {
    fill.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', pct);
    sub.textContent = text;
    await sleep(pct > 60 ? 1500 : 1000);
  }
  document.body.classList.remove('busy');
  closeWin(w);
  await msg({
    icon: 'err', title: 'Block failed', width: 340,
    text: `Error 0x10VE: Could not block ${esc(CONFIG.contact)}.<br><br>This contact is stored in your heart, not your phone. HeartOS cannot remove it.`,
    ok: 'Oh no',
  });
}

/* ---------- Scene 5: the letter, then making up ---------- */
async function openLetter(type = true) {
  const text = CONFIG.letter.replace(/\{HER\}/g, CONFIG.her).replace(/\{HIM\}/g, CONFIG.signature);
  const width = Math.min(560, innerWidth - 12);
  let w;
  w = openWin({
    title: 'sorry.txt - Notepad',
    width, cls: 'notepad',
    onClose: () => closeWin(w),
    help: 'Read it twice.',
    html: `<div class="menubar" aria-hidden="true"><span>File</span><span>Edit</span><span>Search</span><span>Help</span></div>
           <div class="paper" tabindex="0"><span data-text></span><span class="caret"></span></div>`,
  });
  const out = $('[data-text]', w), paper = $('.paper', w);
  if (!type || reduceMotion) { out.textContent = text; return; }
  for (const ch of text) {
    out.textContent += ch;
    paper.scrollTop = paper.scrollHeight;
    await sleep(ch === '\n' ? 220 : ch === '.' || ch === ',' ? 160 : 32);
  }
}

function askMakeUp() {
  return new Promise(resolve => {
    const w = openWin({
      title: 'Plan B', width: 340,
      x: innerWidth / 2 - 170, y: 24,
      help: 'Hint: one of these buttons is broken. It is not the "Yes" button.',
      html: `
        <div class="row">${ICON.heart}
          <div>
            <p>Blocking him didn't work. So, plan B.</p>
            <p><b>Can we make up?</b></p>
          </div>
        </div>
        <div class="actions center">
          <button class="b default yes-grow" data-yes>Yes</button>
          <button class="b" data-no>No</button>
        </div>`,
    });
    const yes = $('[data-yes]', w), no = $('[data-no]', w);
    makeRunaway(no, {
      avoid: w, grow: yes,
      labels: ['No', 'Are you sure?', 'Really?', 'Think again', 'Wrong button',
        'Try the other one', 'Nope', 'Still no?', 'Not allowed', 'Please?', '🥺'],
      errors: [
        'The answer "No" was not found.',
        'Invalid input. Expected: "Yes".',
        "You already couldn't block him. Just say yes.",
        'Nice try.',
      ],
    });
    yes.onclick = () => { closePopups(); no.remove(); closeWin(w); resolve(); };
    yes.focus({ preventScroll: true });
  });
}

async function finale() {
  finished = true;
  document.body.classList.add('love');
  sfx.love();
  heartRain();
  await sleep(600);
  await openLetter(true);
  await sleep(800);
  await askMakeUp();
  heartBurst(80);
  await msg({
    icon: 'heart', title: 'Peace treaty signed', sound: sfx.love,
    text: "He's still not blocked, and now he's forgiven too.<br><br>You pick the restaurant. He's paying.",
    ok: 'Deal ❤️',
    x: innerWidth / 2 - 160, y: 24,
  });
  heartBurst(80);
  sfx.startup();
}

/* ---------- Run ---------- */
(async () => {
  await boot();
  desktop.hidden = false;
  $('#taskbar').hidden = false;
  sfx.startup();
  await sleep(900);
  await askWhy();
  await askWhen();
  await forceBlock();
  await blocking();
  await finale();
})();
</script>
